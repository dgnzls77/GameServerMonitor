services:
  game-server-monitor:
    container_name: game-server-monitor
    build:
      context: .
      dockerfile: Dockerfile
    image: dgnzls77/game-server-monitor:local
    command: ["python", "-u", "main.py"]
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data:/usr/src/app/data
      - ./secrets/game-server-control-ca.pem:/run/secrets/game-server-control-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
